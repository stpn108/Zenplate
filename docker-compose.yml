name: ${COMPOSE_PROJECT_NAME:-zenplate}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
      - shared
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./volumes/backups:/backups
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    # Backup job, run by Ofelia (callisto-services) inside this container. The job name
    # carries the Compose project name, so jobs of several projects never collide.
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.backup-${COMPOSE_PROJECT_NAME:-zenplate}.schedule=${BACKUP_SCHEDULE:-0 0 */4 * * *}"
      - "ofelia.job-exec.backup-${COMPOSE_PROJECT_NAME:-zenplate}.command=/bin/sh /db-backup.sh"
      - "ofelia.job-exec.backup-${COMPOSE_PROJECT_NAME:-zenplate}.user=${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${PORTS_PREFIX}010:8000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app-tests:
    build:
      context: ./app
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./app:/app
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      TZ: ${TZ:-Europe/Berlin}
    command: /bin/sh -c "rm -fr .testmondata .pytest_cache; pytest --testmon --cov=. --cov-report=term || true; ptw . --delay 2 --testmon -v"
    restart: unless-stopped
    tty: true
    stdin_open: true

networks:
  shared:
    name: shared_net
    external: true
